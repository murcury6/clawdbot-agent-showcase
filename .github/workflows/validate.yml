name: Validate source snapshot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify reviewed release
        shell: pwsh
        run: ./tools/verify-release.ps1
      - name: Parse source and test isolated functions
        shell: pwsh
        run: ./tools/test-source.ps1
